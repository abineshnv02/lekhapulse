services:
  postgres:
    image: 'postgres:16'
    container_name: lekhapulse-postgres
    environment:
      POSTGRES_DB: lekhapulse
      POSTGRES_USER: lekhapulse_app
      POSTGRES_PASSWORD: lekhapulse_dev_password
    ports:
      - '5433:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U lekhapulse_app -d lekhapulse
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: 'redis:8-alpine'
    container_name: lekhapulse-redis
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: 'lekhapulse-api:latest'
    container_name: lekhapulse-api
    env_file:
      - ./backend/django-api/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'
    command:
      - python
      - manage.py
      - runserver
      - '0.0.0.0:8000'
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    image: 'lekhapulse-api:latest'
    container_name: lekhapulse-celery
    env_file:
      - ./backend/django-api/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery worker --loglevel=info
    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "config.celery",
          "inspect",
          "ping"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: 'lekhapulse-frontend:latest'
    container_name: lekhapulse-frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - '3000:80'
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1/"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
