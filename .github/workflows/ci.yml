name: LekhaPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lekhapulse
          POSTGRES_USER: lekhapulse_app
          POSTGRES_PASSWORD: lekhapulse_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lekhapulse_app -d lekhapulse"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend/django-api

    env:
      DJANGO_SECRET_KEY: ci-django-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      GEMINI_API_KEY: ci-placeholder-key

      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost

      DATABASE_NAME: lekhapulse
      DATABASE_USER: lekhapulse_app
      DATABASE_PASSWORD: lekhapulse_ci_password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"

      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1

      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "15"
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/django-api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend verification
        run: ./scripts/verify.sh


  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend verification
        run: npm run verify
